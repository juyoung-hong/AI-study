[project]
name = "ai-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juyoung Hong", email = "hjy_stat@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.4",
    "hydra-optuna-sweeper>=1.2.0",
    "lightning>=2.6.5",
    "rich>=15.0.0",
    "rootutils>=1.0.7",
    "setuptools>=83.0.0",
    "tensorboard>=2.21.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
ai-study = "ai_study:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
